        <div class="cadastro">
            <h4>Faça seu cadastro para realizar as opções acima.</h4>
            <form action="assets/php/cad.php" method="post">
                <label for="">Nome: </label>
                <input type="text" name="nome" placeholder="Ex: Maria Silva" maxlength="50" required>

                <input type="text" name="endereco" placeholder="Ex: Av. Paulista, 1000 - Apto 42" maxlength="70" required>

            </form>
        </div>
